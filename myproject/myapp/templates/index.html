<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Projects</title>
</head>
<body>
<h1>Projects</h1>
<p><a href="{% url 'student_register' %}">Student registration</a></p>
<p><a href="{% url 'student_login' %}">Student login</a></p>
<p><a href="{% url 'register_project' %}">Register a project</a></p>
<ul>
    {% for project in projects %}
    <li>{{ project.topic }} — {{ project.languages_used }} ({{ project.duration }} days)</li>
    {% empty %}
    <li>No projects registered yet.</li>
    {% endfor %}
</ul>
</body>
</html>
