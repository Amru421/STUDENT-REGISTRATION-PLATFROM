<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Student login</title>
</head>
<body>
<h1>Student login</h1>
{% if form.errors %}
<p role="alert">Username or password is incorrect.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p><a href="{% url 'student_register' %}">Create a student account</a></p>
<p><a href="{% url 'index' %}">Back to projects</a></p>
</body>
</html>
